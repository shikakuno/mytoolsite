<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Markdown Gantt (single HTML)</title>
  <style>
    :root{
      --bg:#0b0f14; --panel:#101826; --panel2:#0f1724; --text:#e6edf3; --muted:#9fb0c0;
      --grid:#243447; --axis:#3a4b60; --accent:#4cc9f0; --warn:#ff6b6b;
      --rowH:28px;
      --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans JP", Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }
    body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font); }
    header{
      position:sticky; top:0; z-index:10;
      background:linear-gradient(to bottom, rgba(11,15,20,.95), rgba(11,15,20,.75));
      backdrop-filter: blur(10px);
      border-bottom:1px solid rgba(255,255,255,.06);
      padding:12px 14px;
      display:flex; gap:12px; align-items:center; flex-wrap:wrap;
    }
    header h1{ font-size:14px; margin:0; letter-spacing:.2px; color:var(--muted); font-weight:600; }
    .btn{
      appearance:none; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.06);
      color:var(--text); padding:8px 10px; border-radius:10px; cursor:pointer;
      font-size:12px; display:inline-flex; gap:8px; align-items:center;
    }
    .btn:hover{ background:rgba(255,255,255,.1); }
    .btn.primary{ border-color:rgba(76,201,240,.35); background:rgba(76,201,240,.12); }
    .btn.primary:hover{ background:rgba(76,201,240,.18); }
    .btn.danger{ border-color:rgba(255,107,107,.35); background:rgba(255,107,107,.10); }
    .btn.danger:hover{ background:rgba(255,107,107,.16); }
    .btn.ghost{ border-color:rgba(255,255,255,.08); background:transparent; }
    .btn.ghost:hover{ background:rgba(255,255,255,.06); }

    .wrap{
      display:grid;
      grid-template-columns: 460px 1fr;
      gap:12px;
      padding:12px;
      height: calc(100vh - 60px);
      box-sizing:border-box;
    }
    @media (max-width: 980px){
      .wrap{ grid-template-columns: 1fr; height:auto; }
    }
    .card{
      background:linear-gradient(180deg, rgba(16,24,38,.9), rgba(15,23,36,.9));
      border:1px solid rgba(255,255,255,.08);
      border-radius:16px;
      overflow:hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
      display:flex; flex-direction:column;
      min-height: 240px;
    }
    .card .hd{
      padding:12px 12px 8px;
      border-bottom:1px solid rgba(255,255,255,.06);
      display:flex; align-items:flex-start; justify-content:space-between; gap:10px; flex-wrap:wrap;
    }
    .card .hd .title{ font-weight:700; font-size:13px; }
    .card .hd .sub{ color:var(--muted); font-size:12px; }

    textarea#md{
      flex:1;
      width:100%;
      box-sizing:border-box;
      background:transparent;
      color:var(--text);
      border:0;
      outline:none;
      padding:12px;
      resize:none;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size:12px;
      line-height:1.4;
    }

    .controls{
      display:flex; gap:10px; align-items:center; flex-wrap:wrap;
      color:var(--muted); font-size:12px;
    }
    .controls label{ display:inline-flex; gap:8px; align-items:center; }
    input[type="range"]{ width:180px; }
    input[type="checkbox"]{ transform: translateY(1px); }

    .hint{
      padding:10px 12px;
      border-top:1px solid rgba(255,255,255,.06);
      color:var(--muted);
      font-size:12px;
      background:rgba(0,0,0,.12);
    }
    .hint code{ color:var(--text); background:rgba(255,255,255,.06); padding:2px 6px; border-radius:8px; }

    .rowEditor{
      border-top:1px solid rgba(255,255,255,.06);
      background: rgba(0,0,0,.14);
      padding:10px 12px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .rowEditor .top{
      display:flex; align-items:center; gap:8px; flex-wrap:wrap;
      color:var(--muted); font-size:12px;
    }
    .rowEditor input[type="number"]{
      width:110px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      color:var(--text);
      padding:6px 8px;
      border-radius:10px;
      outline:none;
    }
    .rowEditor input[type="text"]{
      flex:1;
      min-width: 220px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      color:var(--text);
      padding:6px 8px;
      border-radius:10px;
      outline:none;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size:12px;
    }
    .rowEditor .msg{
      color: rgba(159,176,192,.95);
      font-size: 12px;
      white-space: pre-wrap;
    }
    .rowEditor .msg.err{
      color: #ffd4d4;
    }

    .stage{
      position:relative;
      overflow:auto;
      height:100%;
    }
    .stageInner{
      min-width: 900px;
      padding:12px;
    }
    .errBox{
      padding:10px 12px;
      background: rgba(255,107,107,.12);
      border: 1px solid rgba(255,107,107,.22);
      border-radius:12px;
      color: #ffd4d4;
      font-size:12px;
      margin: 12px;
      white-space: pre-wrap;
    }
    .legend{
      display:flex; gap:10px; flex-wrap:wrap; padding:10px 12px;
      border-top:1px solid rgba(255,255,255,.06);
      background: rgba(0,0,0,.10);
      color: var(--muted);
      font-size:12px;
    }
    .pill{ display:inline-flex; gap:8px; align-items:center; padding:6px 10px; border-radius:999px; border:1px solid rgba(255,255,255,.10); background: rgba(255,255,255,.05); }
    .swatch{ width:10px; height:10px; border-radius:3px; display:inline-block; }

    .fileInput{ display:none; }
  </style>
</head>
<body>
  <header>
    <h1>Markdown → ガントチャート（HTMLファイル1つ）</h1>

    <button class="btn primary" id="btnRender">描画</button>

    <label class="btn ghost" for="fileImport">インポート（.md/.txt）</label>
    <input class="fileInput" id="fileImport" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" />

    <button class="btn" id="btnExport">エクスポート（.md）</button>

    <button class="btn" id="btnDownloadSvg">SVG保存</button>
    <button class="btn" id="btnDownloadPng">PNG保存</button>

    <button class="btn danger" id="btnClear">クリア</button>

    <div class="controls" style="margin-left:auto;">
      <label>横スケール（日あたりpx）
        <input type="range" id="scale" min="10" max="80" value="28" />
        <span id="scaleVal">28</span>
      </label>
      <label><input type="checkbox" id="showToday" checked>今日ライン</label>
      <label><input type="checkbox" id="showWeekends" checked>土日網掛け</label>
      <label><input type="checkbox" id="compact">コンパクト</label>
    </div>
  </header>

  <div class="wrap">
    <section class="card">
      <div class="hd">
        <div>
          <div class="title">Markdownデータ</div>
          <div class="sub">対応形式：Markdown表 / パイプ区切り行（箇条書きOK）</div>
        </div>
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          <span class="sub">サンプルプリセット：</span>
          <button class="btn" id="presetA">プロジェクトA</button>
          <button class="btn" id="presetB">研究開発</button>
          <button class="btn" id="presetC">研修計画</button>
        </div>
      </div>

      <textarea id="md"></textarea>

      <!-- 行番号編集 -->
      <div class="rowEditor">
        <div class="top">
          <strong style="color:rgba(230,237,243,.95); font-size:12px;">行番号編集</strong>
          <span>行：</span>
          <input type="number" id="lineNo" min="1" step="1" value="1" />
          <button class="btn" id="btnLoadLine">表示</button>
          <button class="btn primary" id="btnSaveLine">保存</button>
          <button class="btn" id="btnJumpLine">その行へスクロール</button>
        </div>
        <input type="text" id="lineText" placeholder="ここに選択行の内容が表示されます（編集して保存できます）" />
        <div class="msg" id="lineMsg"></div>
      </div>

      <div class="hint">
        行の例：<code>タスク名 | 2026-02-01 | 2026-02-10 | 担当 | #4cc9f0</code><br/>
        表の例：<code>| Task | Start | End | Owner | Color |</code>（ヘッダ名は大小/日本語でもOK）
      </div>
    </section>

    <section class="card">
      <div class="hd">
        <div>
          <div class="title">プレビュー</div>
          <div class="sub">スクロール・ズーム・保存対応</div>
        </div>
        <div class="sub" id="meta"></div>
      </div>
      <div class="stage" id="stage">
        <div class="stageInner">
          <div id="error" style="display:none;"></div>
          <div id="svgHost"></div>
        </div>
      </div>
      <div class="legend" id="legend" style="display:none;"></div>
    </section>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  const el = {
    md: $("md"),
    btnRender: $("btnRender"),

    fileImport: $("fileImport"),
    btnExport: $("btnExport"),

    btnDownloadSvg: $("btnDownloadSvg"),
    btnDownloadPng: $("btnDownloadPng"),
    btnClear: $("btnClear"),

    presetA: $("presetA"),
    presetB: $("presetB"),
    presetC: $("presetC"),

    lineNo: $("lineNo"),
    lineText: $("lineText"),
    btnLoadLine: $("btnLoadLine"),
    btnSaveLine: $("btnSaveLine"),
    btnJumpLine: $("btnJumpLine"),
    lineMsg: $("lineMsg"),

    scale: $("scale"),
    scaleVal: $("scaleVal"),
    showToday: $("showToday"),
    showWeekends: $("showWeekends"),
    compact: $("compact"),

    svgHost: $("svgHost"),
    error: $("error"),
    meta: $("meta"),
    legend: $("legend"),
    stage: $("stage"),
  };

  // ====== Presets (サンプルをプリセットする) ======
  const PRESETS = {
    "プロジェクトA": `# プロジェクトA

| Task | Start | End | Owner | Color |
|---|---:|---:|---|---|
| 要件定義 | 2026-02-01 | 2026-02-07 | 角野 | #4cc9f0 |
| 設計 | 2026-02-06 | 2026-02-14 | 田中 | #a3ff12 |
| 実装 | 2026-02-10 | 2026-02-25 | 佐藤 | #ffb703 |
| テスト | 2026-02-20 | 2026-03-03 | 鈴木 | #ff6b6b |
| リリース | 2026-03-05 | 2026-03-05 | 全員 | #8ecae6 |

## 別形式（パイプ区切り行でもOK）
- ドキュメント整備 | 2026-02-12 | 2026-02-18 | 角野 | #c77dff
`,
    "研究開発": `# 研究開発（例）

- 文献調査 | 2026-02-03 | 2026-02-12 | R&D | #4cc9f0
- PoC設計 | 2026-02-10 | 2026-02-18 | R&D | #ffb703
- プロトタイプ実装 | 2026-02-17 | 2026-03-04 | Dev | #a3ff12
- 評価（性能/精度） | 2026-03-01 | 2026-03-10 | QA | #ff6b6b
- レポート作成 | 2026-03-08 | 2026-03-14 | R&D | #c77dff
`,
    "研修計画": `# 研修計画（例）

| タスク | 開始日 | 終了日 | 担当 | 色 |
|---|---|---|---|---|
| 事前アンケート | 2026-02-05 | 2026-02-06 | 事務局 | #8ecae6 |
| 教材作成 | 2026-02-06 | 2026-02-20 | 講師 | #4cc9f0 |
| 受講募集 | 2026-02-10 | 2026-02-18 | 事務局 | #ffb703 |
| 研修実施 | 2026-02-25 | 2026-02-25 | 講師 | #a3ff12 |
| フォローアップ | 2026-02-26 | 2026-03-05 | 講師 | #ff6b6b |
`
  };

  // ---------- Utilities ----------
  const pad2 = (n) => String(n).padStart(2, "0");
  const fmtYMD = (d) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;

  function parseDate(s) {
    const t = String(s || "").trim();
    const m = t.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})$/);
    if (!m) return null;
    const y = Number(m[1]), mo = Number(m[2])-1, da = Number(m[3]);
    const d = new Date(y, mo, da);
    if (d.getFullYear() !== y || d.getMonth() !== mo || d.getDate() !== da) return null;
    return d;
  }

  function daysBetween(a, b) {
    const ms = 24*60*60*1000;
    const A = new Date(a.getFullYear(), a.getMonth(), a.getDate()).getTime();
    const B = new Date(b.getFullYear(), b.getMonth(), b.getDate()).getTime();
    return Math.round((B - A) / ms);
  }

  function addDays(d, n) {
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() + n);
    return x;
  }

  function isWeekend(d) {
    const w = d.getDay();
    return w === 0 || w === 6;
  }

  function sanitizeText(s) {
    return String(s ?? "").replace(/[<>&"]/g, (c) => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
  }

  function normalizeHeaderName(s) {
    const t = String(s||"").trim().toLowerCase();
    const map = new Map([
      ["task","task"], ["name","task"], ["title","task"], ["タスク","task"], ["作業","task"], ["項目","task"],
      ["start","start"], ["開始","start"], ["開始日","start"], ["開始日付","start"], ["from","start"], ["開始日（from）","start"],
      ["end","end"], ["終了","end"], ["終了日","end"], ["終了日付","end"], ["to","end"],
      ["owner","owner"], ["担当","owner"], ["担当者","owner"], ["assignee","owner"],
      ["color","color"], ["色","color"], ["カラー","color"],
      ["group","group"], ["カテゴリ","group"], ["category","group"], ["phase","group"]
    ]);
    return map.get(t) || t;
  }

  // ---------- Parsing ----------
  function parseMarkdownGantt(mdText) {
    const lines = String(mdText||"")
      .split(/\r?\n/)
      .map(l => l.trim())
      .filter(l => l.length > 0 && !l.startsWith("```"));

    const tasks = [];

    // 1) markdown tables
    for (let i=0; i<lines.length; i++) {
      const line = lines[i];
      if (!line.startsWith("|")) continue;

      const header = splitRow(line);
      if (header.length < 3) continue;

      const sep = lines[i+1] || "";
      if (sep.startsWith("|") && isSeparatorRow(sep)) {
        const headerMap = header.map(normalizeHeaderName);
        i += 2;
        while (i < lines.length && lines[i].startsWith("|")) {
          if (isSeparatorRow(lines[i])) { i++; continue; }
          const row = splitRow(lines[i]);
          const obj = rowToTask(row, headerMap);
          if (obj) tasks.push(obj);
          i++;
        }
        i--;
      }
    }

    // 2) pipe rows
    for (const raw of lines) {
      const line = raw.replace(/^\s*[-*]\s*/, "");
      if (line.startsWith("|")) continue;
      if ((line.match(/\|/g)||[]).length < 2) continue;
      const parts = line.split("|").map(x => x.trim()).filter(Boolean);
      if (parts.length < 3) continue;
      const [task, start, end, owner, color, group] = parts;
      const s = parseDate(start), e = parseDate(end);
      if (!task || !s || !e) continue;
      tasks.push({ task, start: s, end: e, owner: owner||"", color: color||"", group: group||"" });
    }

    for (const t of tasks) {
      if (t.end < t.start) { const tmp=t.start; t.start=t.end; t.end=tmp; }
      t.task = String(t.task||"").trim();
      t.owner = String(t.owner||"").trim();
      t.color = String(t.color||"").trim();
      t.group = String(t.group||"").trim();
    }

    const key = (t) => [t.task, fmtYMD(t.start), fmtYMD(t.end), t.owner].join("::");
    const seen = new Set();
    const out = [];
    for (const t of tasks) {
      const k = key(t);
      if (!seen.has(k)) { seen.add(k); out.push(t); }
    }
    return out;

    function splitRow(line) {
      return line
        .split("|")
        .map(x => x.trim())
        .filter((x, idx, arr) => !(idx===0 && x==="") && !(idx===arr.length-1 && x===""));
    }

    function isSeparatorRow(line) {
      const cells = splitRow(line);
      if (cells.length === 0) return false;
      return cells.every(c => /^:?-{3,}:?$/.test(c));
    }

    function rowToTask(row, headerMap) {
      const obj = { task:"", start:null, end:null, owner:"", color:"", group:"" };
      for (let j=0; j<Math.min(row.length, headerMap.length); j++) {
        const k = headerMap[j], v = row[j];
        if (k === "task") obj.task = v;
        else if (k === "start") obj.start = parseDate(v);
        else if (k === "end") obj.end = parseDate(v);
        else if (k === "owner") obj.owner = v;
        else if (k === "color") obj.color = v;
        else if (k === "group") obj.group = v;
      }
      if (!obj.task || !obj.start || !obj.end) return null;
      return obj;
    }
  }

  // ---------- Render (SVG) ----------
  function render(tasks, opts) {
    const { pxPerDay, showToday, showWeekends, compact } = opts;

    if (!tasks.length) {
      showError("タスクが見つかりませんでした。\nMarkdown表、または「タスク | 開始 | 終了 | 担当 | 色」のパイプ区切り行で入力してください。");
      el.svgHost.innerHTML = "";
      el.legend.style.display = "none";
      el.meta.textContent = "";
      return;
    }

    tasks.sort((a,b) => a.start - b.start || a.end - b.end || a.task.localeCompare(b.task, "ja"));

    let min = tasks[0].start, max = tasks[0].end;
    for (const t of tasks) {
      if (t.start < min) min = t.start;
      if (t.end > max) max = t.end;
    }

    const padLeft = 2, padRight = 2;
    const startDate = addDays(min, -padLeft);
    const endDate = addDays(max, padRight);

    const totalDays = daysBetween(startDate, endDate) + 1;
    const leftLabelW = compact ? 180 : 260;
    const rowH = compact ? 22 : 28;
    const topAxisH = compact ? 52 : 62;
    const barH = compact ? 12 : 14;
    const barYPad = Math.max(4, Math.floor((rowH - barH)/2));
    const w = leftLabelW + totalDays * pxPerDay + 24;
    const h = topAxisH + tasks.length * rowH + 20;

    const today = new Date();
    const today0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());

    const by = (t) => (t.group || t.owner || "未分類");
    const buckets = new Map();
    for (const t of tasks) {
      const k = by(t);
      if (!buckets.has(k)) buckets.set(k, new Set());
      if (t.color) buckets.get(k).add(t.color);
    }

    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    svg.setAttribute("width", w);
    svg.setAttribute("height", h);
    svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    svg.style.display = "block";

    rect(0, 0, w, h, { fill: "rgba(0,0,0,0)" });

    for (let d=0; d<totalDays; d++) {
      const x = leftLabelW + d*pxPerDay;
      const date = addDays(startDate, d);

      if (showWeekends && isWeekend(date)) {
        rect(x, topAxisH, pxPerDay, h-topAxisH-10, { fill: "rgba(255,255,255,.04)" });
      }
      line(x, topAxisH, x, h-10, { stroke: "rgba(255,255,255,.08)", "stroke-width": 1 });
    }
    line(leftLabelW + totalDays*pxPerDay, topAxisH, leftLabelW + totalDays*pxPerDay, h-10, { stroke:"rgba(255,255,255,.08)", "stroke-width":1 });

    rect(0, topAxisH, leftLabelW, h-topAxisH-10, { fill: "rgba(0,0,0,.12)" });
    line(leftLabelW, 0, leftLabelW, h, { stroke: "rgba(255,255,255,.12)", "stroke-width": 1 });

    for (let r=0; r<=tasks.length; r++) {
      const y = topAxisH + r*rowH;
      line(0, y, w, y, { stroke:"rgba(255,255,255,.08)", "stroke-width": 1 });
    }

    rect(0, 0, w, topAxisH, { fill: "rgba(0,0,0,.16)" });
    line(0, topAxisH, w, topAxisH, { stroke:"rgba(255,255,255,.12)", "stroke-width": 1 });

    let lastMonth = -1;
    for (let d=0; d<totalDays; d++) {
      const date = addDays(startDate, d);
      const x = leftLabelW + d*pxPerDay;

      text(x + pxPerDay/2, topAxisH - (compact ? 10 : 12), String(date.getDate()), {
        "text-anchor":"middle",
        "font-size": compact ? 10 : 11,
        fill: "rgba(230,237,243,.85)"
      });

      if (date.getMonth() !== lastMonth) {
        lastMonth = date.getMonth();
        const label = `${date.getFullYear()}-${pad2(date.getMonth()+1)}`;
        text(x + 2, compact ? 14 : 16, label, {
          "text-anchor":"start",
          "font-size": compact ? 11 : 12,
          "font-weight": 700,
          fill: "rgba(159,176,192,.95)"
        });
      }

      if (date.getDay() === 1) {
        line(x, 0, x, topAxisH, { stroke:"rgba(255,255,255,.14)", "stroke-width": 1 });
        const wk = isoWeek(date);
        text(x + 4, compact ? 30 : 36, `W${wk}`, {
          "text-anchor":"start",
          "font-size": compact ? 10 : 11,
          fill: "rgba(159,176,192,.9)"
        });
      }
    }

    text(12, compact ? 16 : 18, "Task", { "font-size": compact?11:12, "font-weight":700, fill:"rgba(159,176,192,.95)" });
    text(12, compact ? 34 : 40, "Owner / Group", { "font-size": compact?10:11, fill:"rgba(159,176,192,.85)" });

    if (showToday && today0 >= startDate && today0 <= endDate) {
      const d = daysBetween(startDate, today0);
      const x = leftLabelW + d*pxPerDay + pxPerDay/2;
      line(x, 0, x, h-10, { stroke: "rgba(255,107,107,.8)", "stroke-width": 2 });
      text(x + 6, compact ? 46 : 52, "TODAY", {
        "text-anchor":"start",
        "font-size": compact ? 10 : 11,
        "font-weight": 800,
        fill: "rgba(255,107,107,.9)"
      });
    }

    for (let i=0; i<tasks.length; i++) {
      const t = tasks[i];
      const y = topAxisH + i*rowH;

      text(12, y + (compact ? 14 : 17), truncate(t.task, compact ? 22 : 30), {
        "text-anchor":"start",
        "font-size": compact ? 11 : 12,
        "font-weight": 700,
        fill: "rgba(230,237,243,.95)"
      });

      const sub = (t.group || t.owner || "").trim();
      if (sub) {
        text(12, y + (compact ? 30 : 34), truncate(sub, compact ? 28 : 36), {
          "text-anchor":"start",
          "font-size": compact ? 10 : 11,
          fill: "rgba(159,176,192,.9)"
        });
      }

      const startOffset = daysBetween(startDate, t.start);
      const endOffset = daysBetween(startDate, t.end);
      const x = leftLabelW + startOffset*pxPerDay;
      const barW = Math.max(pxPerDay, (endOffset - startOffset + 1) * pxPerDay);

      const fill = validColor(t.color) ? t.color : "rgba(76,201,240,.75)";
      const stroke = "rgba(255,255,255,.18)";

      const ry = 8;
      rect(x + 2, y + barYPad, barW - 4, barH, { fill, stroke, "stroke-width": 1, rx: ry, ry });

      const dur = endOffset - startOffset + 1;
      const label = compact ? `${dur}d` : `${fmtYMD(t.start)} → ${fmtYMD(t.end)} (${dur}日)`;
      text(x + 8, y + barYPad + barH - (compact ? 3 : 4), sanitizeText(label), {
        "text-anchor":"start",
        "font-size": compact ? 9 : 10,
        fill: "rgba(11,15,20,.92)",
        "font-weight": 800
      });
    }

    clearError();
    el.svgHost.innerHTML = "";
    el.svgHost.appendChild(svg);

    el.meta.textContent = `${fmtYMD(min)} 〜 ${fmtYMD(max)} / ${tasks.length}件`;
    renderLegend(buckets);

    if (showToday && today0 >= startDate && today0 <= endDate) {
      const d = daysBetween(startDate, today0);
      const x = leftLabelW + d*pxPerDay;
      el.stage.scrollLeft = Math.max(0, x - el.stage.clientWidth * 0.45);
    }

    function rect(x,y,w,h, attrs={}) {
      const r = document.createElementNS("http://www.w3.org/2000/svg","rect");
      r.setAttribute("x", x); r.setAttribute("y", y);
      r.setAttribute("width", w); r.setAttribute("height", h);
      for (const [k,v] of Object.entries(attrs)) r.setAttribute(k, v);
      svg.appendChild(r);
      return r;
    }
    function line(x1,y1,x2,y2, attrs={}) {
      const l = document.createElementNS("http://www.w3.org/2000/svg","line");
      l.setAttribute("x1", x1); l.setAttribute("y1", y1);
      l.setAttribute("x2", x2); l.setAttribute("y2", y2);
      for (const [k,v] of Object.entries(attrs)) l.setAttribute(k, v);
      svg.appendChild(l);
      return l;
    }
    function text(x,y, str, attrs={}) {
      const t = document.createElementNS("http://www.w3.org/2000/svg","text");
      t.setAttribute("x", x); t.setAttribute("y", y);
      for (const [k,v] of Object.entries(attrs)) t.setAttribute(k, v);
      t.textContent = str;
      svg.appendChild(t);
      return t;
    }
  }

  function isoWeek(date){
    const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const dayNum = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
    return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  }

  function truncate(s, n){
    const t = String(s||"");
    return t.length > n ? t.slice(0, n-1) + "…" : t;
  }

  function validColor(s){
    if (!s) return false;
    const t = String(s).trim();
    return /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/.test(t) || /^rgba?\(/.test(t);
  }

  function showError(msg){
    el.error.style.display = "block";
    el.error.className = "errBox";
    el.error.textContent = msg;
  }
  function clearError(){
    el.error.style.display = "none";
    el.error.textContent = "";
  }

  function setLineMsg(msg, isErr=false){
    el.lineMsg.textContent = msg || "";
    el.lineMsg.className = "msg" + (isErr ? " err" : "");
  }

  function renderLegend(buckets){
    el.legend.innerHTML = "";
    if (!buckets.size) { el.legend.style.display = "none"; return; }
    const entries = Array.from(buckets.entries()).slice(0, 20);
    for (const [k, colors] of entries) {
      const color = Array.from(colors)[0] || "rgba(76,201,240,.75)";
      const div = document.createElement("div");
      div.className = "pill";
      div.innerHTML = `<span class="swatch" style="background:${color}"></span><span>${sanitizeText(k)}</span>`;
      el.legend.appendChild(div);
    }
    el.legend.style.display = "flex";
  }

  // ====== Import / Export (ファイルをインポート、エクスポート) ======
  function downloadText(filename, text){
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], {type:"text/plain;charset=utf-8"}));
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
  }

  function downloadBlob(filename, blob){
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
  }

  // ====== SVG/PNG save ======
  function getSvgEl(){ return el.svgHost.querySelector("svg"); }

  function svgToPngBlob(svgEl, scale=2){
    return new Promise((resolve, reject) => {
      const xml = new XMLSerializer().serializeToString(svgEl);
      const svg64 = btoa(unescape(encodeURIComponent(xml)));
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.setTransform(scale,0,0,scale,0,0);
        ctx.drawImage(img, 0, 0);
        canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error("PNG変換に失敗しました")), "image/png");
      };
      img.onerror = () => reject(new Error("SVGの読み込みに失敗しました"));
      img.src = "data:image/svg+xml;base64," + svg64;
    });
  }

  // ====== Line editor (行番号入力→表示→編集/保存) ======
  function getLines(){
    // keep original newlines
    return String(el.md.value || "").split(/\r?\n/);
  }
  function setLines(lines){
    el.md.value = lines.join("\n");
  }
  function loadLine(){
    const n = Number(el.lineNo.value);
    const lines = getLines();
    if (!Number.isFinite(n) || n < 1) return setLineMsg("行番号は1以上で入力してください。", true);
    if (n > lines.length) return setLineMsg(`その行は存在しません（最大 ${lines.length} 行）。`, true);

    const text = lines[n-1];
    el.lineText.value = text;
    setLineMsg(`行 ${n} を読み込みました。`, false);
  }
  function saveLine(){
    const n = Number(el.lineNo.value);
    const lines = getLines();
    if (!Number.isFinite(n) || n < 1) return setLineMsg("行番号は1以上で入力してください。", true);
    if (n > lines.length) return setLineMsg(`その行は存在しません（最大 ${lines.length} 行）。`, true);

    lines[n-1] = el.lineText.value;
    setLines(lines);
    setLineMsg(`行 ${n} を保存しました。`, false);
    doRender();
  }
  function jumpLine(){
    const n = Number(el.lineNo.value);
    const lines = getLines();
    if (!Number.isFinite(n) || n < 1) return setLineMsg("行番号は1以上で入力してください。", true);
    if (n > lines.length) return setLineMsg(`その行は存在しません（最大 ${lines.length} 行）。`, true);

    // scroll textarea to show the line
    const ta = el.md;
    const startIdx = lines.slice(0, n-1).join("\n").length + (n>1 ? 1 : 0);
    const endIdx = startIdx + lines[n-1].length;

    ta.focus();
    ta.setSelectionRange(startIdx, endIdx);

    // rough scroll: compute line height from computed style
    const cs = getComputedStyle(ta);
    const lh = parseFloat(cs.lineHeight) || 16;
    ta.scrollTop = Math.max(0, (n-1) * lh - ta.clientHeight * 0.3);

    setLineMsg(`行 ${n} にジャンプしました（選択済み）。`, false);
  }

  // ---------- Render wiring ----------
  function doRender(){
    const tasks = parseMarkdownGantt(el.md.value);
    const pxPerDay = Number(el.scale.value);
    const compact = el.compact.checked;
    render(tasks, {
      pxPerDay,
      showToday: el.showToday.checked,
      showWeekends: el.showWeekends.checked,
      compact,
    });
  }

  // ---------- UI events ----------
  el.btnRender.addEventListener("click", doRender);

  // presets
  function applyPreset(name){
    el.md.value = PRESETS[name] || "";
    setLineMsg(`プリセット「${name}」を読み込みました。`, false);
    el.lineNo.value = 1;
    el.lineText.value = "";
    doRender();
  }
  el.presetA.addEventListener("click", () => applyPreset("プロジェクトA"));
  el.presetB.addEventListener("click", () => applyPreset("研究開発"));
  el.presetC.addEventListener("click", () => applyPreset("研修計画"));

  // import
  el.fileImport.addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try{
      const text = await file.text();
      el.md.value = text;
      setLineMsg(`インポートしました：${file.name}`, false);
      el.lineNo.value = 1;
      el.lineText.value = "";
      doRender();
    }catch(err){
      setLineMsg(`インポートに失敗しました：${String(err?.message||err)}`, true);
    }finally{
      // allow re-import same filename
      el.fileImport.value = "";
    }
  });

  // export
  el.btnExport.addEventListener("click", () => {
    const now = new Date();
    const stamp = `${now.getFullYear()}${pad2(now.getMonth()+1)}${pad2(now.getDate())}_${pad2(now.getHours())}${pad2(now.getMinutes())}`;
    downloadText(`gantt_${stamp}.md`, el.md.value || "");
    setLineMsg("エクスポートしました。", false);
  });

  // line editor
  el.btnLoadLine.addEventListener("click", loadLine);
  el.btnSaveLine.addEventListener("click", saveLine);
  el.btnJumpLine.addEventListener("click", jumpLine);
  el.lineNo.addEventListener("change", () => { /* keep */ });
  el.lineText.addEventListener("keydown", (e) => {
    // Ctrl/Cmd+Enter = save
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") saveLine();
  });

  // clear
  el.btnClear.addEventListener("click", () => {
    el.md.value = "";
    el.svgHost.innerHTML = "";
    el.legend.style.display = "none";
    el.meta.textContent = "";
    clearError();
    el.lineNo.value = 1;
    el.lineText.value = "";
    setLineMsg("クリアしました。", false);
  });

  // scale toggles
  el.scale.addEventListener("input", () => { el.scaleVal.textContent = el.scale.value; });
  el.scale.addEventListener("change", doRender);
  el.showToday.addEventListener("change", doRender);
  el.showWeekends.addEventListener("change", doRender);
  el.compact.addEventListener("change", doRender);

  // svg/png
  el.btnDownloadSvg.addEventListener("click", () => {
    const svgEl = getSvgEl();
    if (!svgEl) return showError("先に描画してください。");
    const xml = new XMLSerializer().serializeToString(svgEl);
    downloadText("gantt.svg", xml);
  });

  el.btnDownloadPng.addEventListener("click", async () => {
    const svgEl = getSvgEl();
    if (!svgEl) return showError("先に描画してください。");
    try{
      const blob = await svgToPngBlob(svgEl, 2);
      downloadBlob("gantt.png", blob);
    }catch(e){
      showError(String(e?.message || e));
    }
  });

  // initial
  el.scaleVal.textContent = el.scale.value;
  applyPreset("プロジェクトA");
  // line editor initial message
  setLineMsg("行番号を入れて「表示」→編集→「保存」できます。Ctrl/Cmd+Enterで保存もOK。", false);
})();
</script>
</body>
</html>
